[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shadow-dom-booking-scraper"
version = "1.0.0"
description = "Read appointment slots from booking widgets rendered in open shadow DOM."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Mohamed Fouad" }]
keywords = ["playwright", "shadow-dom", "web-scraping", "booking", "csv"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP",
]
dependencies = ["playwright>=1.40"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]

[project.scripts]
booking-scraper = "booking_scraper.cli:main"

[project.urls]
Homepage = "https://github.com/mohamd764/web-scraping-of-js-heavy-websites-"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
booking_scraper = ["fixtures/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
  "browser: tests that launch Chromium",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
